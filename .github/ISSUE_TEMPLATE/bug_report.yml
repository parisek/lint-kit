name: Bug report
description: A rule gives a wrong result, or the preset fails.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of parisek/lint-kit, and your PHP and Twig versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Show the template or the config. Do not paste client data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true

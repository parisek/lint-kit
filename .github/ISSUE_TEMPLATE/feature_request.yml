name: Feature request
description: Ask for a new rule, a new option or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to catch or change, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Show an example template that the rule must flag, and one that it must not.

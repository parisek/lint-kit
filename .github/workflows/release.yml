name: Release

# A tag `vX.Y.Z` is the release (RELEASING.md). Packagist follows the tags through its webhook.
# This workflow validates the package and creates the GitHub Release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --no-check-publish

      - run: composer install --no-progress

      - run: composer test

      - name: Release notes come from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}." >&2
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md ${prerelease}
